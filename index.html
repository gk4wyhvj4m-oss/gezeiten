<style>
:root{
  --olive:#3F3E2C;--olive2:#525139;--olive3:#77745A;
  --cream:#F4EEE3;--paper:#FBF8F2;--sand:#EBE3D4;--line:#E3DACA;
  --taupe:#A69480;--ink:#2B2A20;--ink2:#5F5A4B;--ink3:#948C79;
  --amber:#DE8628;--amberSoft:#F6E0C2;
  --men:#B0503E;--fol:#86A562;--ovu:#D98426;--lut:#5E5B3F;
  --tMen:#EFD2CB;--tMenD:#E6B9AF;--tFol:#E2E8D2;--tOvu:#F6DFB6;--tLut:#EAE2D3;--tFert:#F5EACF;
  --pos:#6F8C4C;--neg:#B0503E;
  --serif:'Gilda Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --r:22px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
#app{max-width:540px;margin:0 auto;min-height:100vh;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 110px)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:400;letter-spacing:.1px}
h1{font-size:34px;line-height:1.1;margin:4px 0 16px}
h2{font-size:25px;line-height:1.15;margin:30px 0 4px}
h3{font-size:19px;margin:0 0 12px}
p{margin:0 0 10px}
.sub{color:var(--ink2);font-size:13.5px;margin:0 0 14px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.muted{color:var(--ink3)}
.ic{width:22px;height:22px;flex:none}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--paper);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card.dark{background:var(--olive);color:var(--cream)}
.card.dark .muted,.card.dark .eyebrow{color:#B7B297}
.card.sand{background:var(--sand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 14px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;color:var(--olive);flex:none}
.iconbtn.sm{width:34px;height:34px}
.iconbtn.sm .ic{width:18px;height:18px}
.iconbtn:disabled{opacity:.3}
.btn{display:block;width:100%;background:var(--amber);color:#fff;border:0;border-radius:999px;padding:15px 22px;font:600 15.5px var(--sans);text-align:center}
.btn.dark{background:var(--olive);color:var(--cream)}
.btn.ghost{background:transparent;color:var(--olive);border:1.2px solid var(--olive)}
.btn.soft{background:var(--sand);color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:9px 16px;font-size:14px}
.link{background:none;border:0;color:var(--amber);font:500 14.5px var(--sans);padding:6px 0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--sand);color:var(--ink2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,248,242,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 10px calc(var(--sab) + 6px)}
.tabbar-in{max-width:540px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-around}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink3);background:none;border:0;padding:6px 0 2px;font-weight:500}
.tab .ic{width:25px;height:25px}
.tab.on{color:var(--olive)}
.tab-add{flex:none;width:56px;height:56px;border-radius:50%;background:var(--amber);color:#fff;border:0;display:grid;place-items:center;margin:-24px 8px 4px;box-shadow:0 8px 18px rgba(222,134,40,.32)}
.tab-add .ic{width:26px;height:26px;stroke-width:2}

/* hero */
.hero{background:var(--paper);border-radius:28px;padding:20px 20px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero .phase{font-family:var(--serif);color:var(--amber);font-size:36px;line-height:1.05;margin:6px 0 0}
.hero .status{font-family:var(--serif);font-size:23px;line-height:1.2;margin:2px 0 4px}
.hero svg.arc{display:block;width:100%;height:auto;margin:6px 0 2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 16px}
.wd{border:0;background:transparent;border-radius:16px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink3)}
.wd b{font-weight:500;font-size:15px;color:var(--ink);width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.wd.today b{background:var(--amber);color:#fff}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}
.wd.has i{background:var(--olive3)}

/* mood faces */
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{border:0;background:transparent;border-radius:16px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink2)}
.face svg{width:40px;height:40px}
.face.on{background:var(--olive);color:var(--cream)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 13px;font-size:14px;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.chip.on{background:var(--olive);border-color:var(--olive);color:var(--cream)}
.chip.add{border-style:dashed;color:var(--ink3)}
.lv{display:inline-flex;gap:2px;align-items:flex-end}
.lv i{width:3px;border-radius:2px;background:currentColor;opacity:.25}
.lv i:nth-child(1){height:6px}.lv i:nth-child(2){height:9px}.lv i:nth-child(3){height:12px}
.lv i.f{opacity:1}
.group-l{font-size:12px;color:var(--ink3);margin:12px 0 8px;letter-spacing:.04em}
.group-l:first-child{margin-top:0}

/* options */
.opts{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:8px}
.opt{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--ink2);min-height:44px;justify-content:center}
.opt.on{background:var(--olive);border-color:var(--olive);color:var(--cream)}
.opt svg{height:24px;width:auto}
.field-l{font-size:13px;color:var(--ink2);margin:16px 0 8px;font-weight:500}
.field-l:first-of-type{margin-top:0}

/* level scale */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--ink3)}
.scale button.f{background:var(--olive3);border-color:var(--olive3);color:var(--cream)}
.scale button.on{background:var(--olive);border-color:var(--olive);color:var(--cream)}
.scale-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:5px}

textarea,.inp{width:100%;border:1px solid var(--line);background:var(--cream);border-radius:16px;padding:12px 14px;outline:none;resize:none}
textarea:focus,.inp:focus{border-color:var(--olive3)}
textarea{min-height:96px;line-height:1.45}
.prompt{font-family:var(--serif);font-size:19px;line-height:1.3;margin:0 0 10px}
.counter{display:flex;align-items:center;gap:14px}
.counter b{font-family:var(--serif);font-size:24px;font-weight:400;min-width:30px;text-align:center}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;visibility:hidden}
.sheet-wrap.open{visibility:visible}
.sheet-bg{position:absolute;inset:0;background:rgba(43,42,32,.38);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;background:var(--cream);border-radius:28px 28px 0 0;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:0 16px calc(var(--sab) + 28px);overscroll-behavior:contain}
.sheet.full{top:calc(var(--sat) + 8px);max-height:none}
.sheet-wrap.show .sheet-bg{opacity:1}
.sheet-wrap.show .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0}
.sheet-head{position:sticky;top:0;z-index:3;background:var(--cream);padding:12px 0 12px;display:flex;align-items:center;gap:10px}
.sheet-head .t{flex:1;min-width:0}
.sheet-head .t .serif{font-size:23px;line-height:1.15}
.sheet-head .t .muted{font-size:12.5px}

/* calendar */
.cal-sticky{position:sticky;top:0;z-index:5;background:var(--cream);padding-top:var(--sat);margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:11.5px;color:var(--ink3);padding:6px 0 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.month{margin:18px 0 6px}
.month h3{font-size:22px;margin:0 0 10px}
.month h3 .y{color:var(--ink3);font-size:15px;font-family:var(--sans)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cd{position:relative;border:0;background:transparent;border-radius:12px;aspect-ratio:1/1.05;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0;color:var(--ink)}
.cd span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.cd.men{background:var(--tMen)}.cd.men.log{background:var(--tMenD)}
.cd.fol{background:var(--tFol)}.cd.ovu{background:var(--tOvu)}.cd.lut{background:var(--tLut)}
.cd.fert{background:var(--tFert)}
.cd.pred{opacity:.72}
.cd.pred.men{background:transparent;box-shadow:inset 0 0 0 1.5px var(--tMenD);opacity:1}
.cd.isovu span{box-shadow:inset 0 0 0 1.5px var(--amber);color:#9A5410;font-weight:600}
.cd.today span{background:var(--amber);color:#fff;font-weight:600;box-shadow:none}
.cd .dot{position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--olive)}
.cd .spot{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--men)}
.cd.out{visibility:hidden}
.cd.fut{color:var(--ink2)}
.cal-edit .cd .chk{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;border:1.3px solid var(--taupe);background:var(--paper)}
.cal-edit .cd.log .chk{background:var(--men);border-color:var(--men)}
.cal-edit .cd.fut{opacity:.35;pointer-events:none}
.editbar{background:var(--olive);color:var(--cream);border-radius:18px;padding:12px 14px;font-size:13.5px;display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.editbar .btn{width:auto;padding:8px 16px;font-size:14px}

/* journal */
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:4px 14px;margin-bottom:12px;color:var(--ink3)}
.search input{border:0;background:transparent;outline:none;flex:1;padding:9px 0}
.hscroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.jentry{display:flex;gap:14px;background:var(--paper);border-radius:var(--r);padding:16px;margin-bottom:12px;border:0;width:100%;text-align:left}
.jdate{flex:none;width:46px;text-align:center}
.jdate .n{font-family:var(--serif);font-size:30px;line-height:1}
.jdate .w{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.jbody{flex:1;min-width:0}
.jbody .txt{font-size:14.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px}
.jbody .q{font-family:var(--serif);font-size:15.5px;color:var(--ink2);margin-top:6px}
.jmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.jmeta svg{width:24px;height:24px}
.jfeel{font-size:12.5px;color:var(--ink3);margin-top:6px}
.mhead{font-family:var(--serif);font-size:20px;margin:20px 0 10px;color:var(--ink2)}

/* insights */
.seg{display:inline-flex;background:var(--sand);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(43,42,32,.12)}
.stat .v{font-family:var(--serif);font-size:32px;line-height:1.05}
.stat .v small{font-family:var(--sans);font-size:13px;color:var(--ink3);margin-left:3px}
.stat .l{font-size:12.5px;color:var(--ink2);margin-top:4px}
.chart{position:relative;margin-top:8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart text{font-family:var(--sans);font-size:10px;fill:var(--ink3)}
.clegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-top:10px}
.clegend span{display:inline-flex;align-items:center;gap:6px}
.clegend i{display:inline-block;width:16px;height:3px;border-radius:2px}
.card.dark .clegend{color:#D6D1B8}
.hcard{background:var(--sand);border-radius:16px;padding:12px 14px;font-size:13.5px;color:var(--ink2);margin-bottom:14px}
.clegend i.dot{width:8px;height:8px;border-radius:50%}
.clegend i.sq{width:11px;height:11px;border-radius:3px}
.insight{display:flex;gap:12px;padding:12px 0;border-top:1px solid rgba(244,238,227,.12)}
.insight:first-of-type{border-top:0;padding-top:4px}
.insight .n{font-family:var(--serif);color:var(--amber);font-size:20px;line-height:1.2;flex:none;width:18px}
.insight p{margin:0;font-size:14.5px;line-height:1.45}
.corr{display:grid;grid-template-columns:1fr 112px 44px;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.corr:first-child,.group-l+.corr{border-top:0}
.corr .lab{font-size:14px;line-height:1.25}
.corr .lab small{display:block;font-size:11.5px;color:var(--ink3)}
.corr .bar{position:relative;height:10px}
.corr .bar:before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--ink3);opacity:.5}
.corr .bar i{position:absolute;top:0;height:10px;border-radius:4px}
.corr .val{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.hbar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:13.5px;padding:4px 0}
.hbar .t{height:10px;background:var(--sand);border-radius:4px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--olive3);border-radius:4px}
.hbar .c{font-size:12.5px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.phcard{border-radius:20px;padding:14px;font-size:13px}
.phcard .serif{font-size:19px;margin-bottom:6px}
.phcard .kv{display:flex;justify-content:space-between;padding:2px 0}
.phcard .kv b{font-weight:600;font-variant-numeric:tabular-nums}
.phcard .ls{color:var(--ink2);margin-top:6px;line-height:1.35}
.empty{text-align:center;padding:26px 18px}
.empty .serif{font-size:22px;margin-bottom:6px}

.str{display:inline-flex;gap:3px;flex:none}.str i{width:7px;height:7px;border-radius:50%;background:var(--line)}.str i.f{background:var(--olive)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.frow:first-child{border-top:0;padding-top:2px}.frow:last-child{padding-bottom:2px}
.ft{font-weight:500;font-size:15px}.fs{font-size:13.5px;color:var(--ink2);line-height:1.4;margin-top:2px}
.prow{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.prow:first-child{border-top:0}.prow>i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.srow{padding:10px 0;border-top:1px solid var(--line)}.srow:first-child{border-top:0;padding-top:2px}.srow .mini{display:block;width:100%;height:12px;margin-top:8px}
details.more{margin-top:26px}details.more>summary{list-style:none;cursor:pointer;background:var(--sand);border-radius:999px;padding:12px 18px;text-align:center;font-weight:500;color:var(--ink2)}
details.more>summary::-webkit-details-marker{display:none}details.more[open]>summary{margin-bottom:6px}
.jgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 2px}
.jwd span{text-align:center;font-size:11px;color:var(--ink3);padding-bottom:4px}
.jd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.jd svg{width:36px;height:36px}
.jd-e{width:36px;height:36px;border-radius:50%;background:var(--sand);display:grid;place-items:center}
.jd-e i{width:10px;height:2px;border-radius:1px;background:var(--ink3)}
.jd.fut .jd-e{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.jd-n{font-size:11px;color:var(--ink3);display:inline-flex;align-items:center;gap:3px;line-height:16px;padding:0 5px;border-radius:999px}
.jd-n i{width:4px;height:4px;border-radius:50%;background:var(--men)}
.jd.today .jd-n{background:var(--amber);color:#fff;font-weight:600}
.jd.today .jd-n i{background:#fff}
.mbar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin-top:16px}
.mbar i{display:block;height:100%}
.face.on{background:var(--sand);color:var(--ink)}
.faces.has .face:not(.on) svg{opacity:.4}
.sugg{display:flex;gap:14px;align-items:flex-start;background:var(--sand)}
.sugg-ic{width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--olive);flex:none}
.ktiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 14px}
.ktile{border:0;background:var(--paper);border-radius:20px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--olive)}
.ktile .ic{width:28px;height:28px}
.ktile b{font-weight:500;color:var(--ink);font-size:14.5px}
.ktile span{font-size:11.5px;color:var(--ink3);line-height:1.3}
.kstep{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:10px 0 4px}
.kstep i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--olive3);flex:none;margin-top:1px}
.kstep span{font-size:14.5px}.kstep small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.garden{display:block;width:calc(100% + 36px);margin:4px -18px 0;height:auto}
.breath{text-align:center;padding:40px 0 20px}
.breath-c{width:220px;height:220px;margin:20px auto 0;border-radius:50%;background:radial-gradient(circle at 50% 45%,#F6E0C2,#E9C79A 60%,#DE8628);transform:scale(.5);opacity:.9}
.ground{text-align:center;padding:24px 4px}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--amber)}
.w5opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:13px 16px;margin-bottom:8px;font-size:15px}
.w5opt.on{background:var(--olive);color:var(--cream);border-color:var(--olive)}
.letters{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.env{display:flex;align-items:center;gap:8px;background:var(--sand);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--ink2);line-height:1.3}
.env .ic{color:var(--amber)}
.letter{font-family:var(--serif);font-size:19px;line-height:1.5;background:#FFFDF8}
.bpick{display:block;width:100%;text-align:left;border:0;background:var(--paper);border-radius:20px;padding:16px 18px;margin-bottom:12px}
.breath-tap{border:0;background:none;padding:0;display:block;margin:0 auto}
.ktiles{grid-template-columns:repeat(2,1fr)!important}
.kstep.done i{background:var(--olive);border-color:var(--olive);box-shadow:inset 0 0 0 3px var(--paper)}
.kstep.done span{color:var(--ink2)}
.cfeel{margin:12px 0}.cfeel b{font-weight:500;font-variant-numeric:tabular-nums}
.cfeel input[type=range]{width:100%;accent-color:var(--olive);margin-top:6px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 6px}
.ktile2{border:0;border-radius:22px;padding:16px 16px 15px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:124px;color:var(--ink)}
.ktile2 .kt-ic{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;margin-bottom:auto}
.ktile2 .kt-ic .ic{width:22px;height:22px}
.ktile2 b{font-weight:500;font-size:15.5px;margin-top:12px}
.ktile2 .kt-s{font-size:12.5px;color:var(--ink2);line-height:1.3}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--olive);color:var(--cream);font-size:12.5px;line-height:1.35;padding:8px 11px;border-radius:12px;max-width:220px;box-shadow:0 6px 18px rgba(43,42,32,.25);opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip b{font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%) translateY(20px);background:var(--olive);color:var(--cream);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:all .25s;z-index:120;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}

/* onboarding */
.onb{position:fixed;inset:0;z-index:80;background:var(--olive);color:var(--cream);overflow-y:auto;padding:calc(var(--sat) + 40px) 24px calc(var(--sab) + 30px)}
.onb-in{max-width:440px;margin:0 auto}
.onb h1{font-size:46px;margin:18px 0 8px}
.onb h1 em{color:var(--amber);font-style:normal}
.onb .lead{color:#CFCAB0;font-size:16px;margin-bottom:30px}
.onb label{display:block;font-size:13px;color:#CFCAB0;margin:20px 0 8px}
.onb .inp{background:var(--olive2);border-color:var(--olive2);color:var(--cream)}
.onb .inp::placeholder{color:#9F9A7F}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-radius:16px;padding:6px}
.onb .stepper{background:var(--olive2)}
.stepper b{font-family:var(--serif);font-size:22px;font-weight:400}
.stepper b small{font-family:var(--sans);font-size:13px;opacity:.6;margin-left:4px}
.stepper button{width:40px;height:40px;border-radius:12px;border:0;background:var(--sand);font-size:22px;line-height:1}
.onb .stepper button{background:var(--olive3);color:var(--cream)}
.note{font-size:12.5px;color:var(--ink3);line-height:1.45}
.onb .note{color:#A9A48A}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-child,h3+.set-row{border-top:0;padding-top:2px}
.toggle{width:50px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none;transition:background .2s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}

function journalList() {

<script>
// =========================================================
// Apple Health über Kurzbefehle
// Format je Zeile: TYP;Startdatum;Enddatum;Wert
// =========================================================
const H_TYPES = {
  SCHLAF: 'sleep', SLEEP: 'sleep', SCHRITTE: 'steps', STEPS: 'steps', TRAINING: 'ex', EXERCISE: 'ex',
  RUHEPULS: 'rhr', RHR: 'rhr', HRV: 'hrv', HANDGELENK: 'wtemp', WRIST: 'wtemp', TEMP: 'wtemp',
  PERIODE: 'period', PERIOD: 'period', MENSTRUATION: 'period'
};
const H_LABEL = { sleep: 'Schlaf', steps: 'Schritte', ex: 'Training', rhr: 'Ruhepuls', hrv: 'HRV', wtemp: 'Handgelenktemperatur', period: 'Periode' };
const hm = m => `${Math.floor(m / 60)}:${pad(Math.round(m % 60))}`;
const fmtInt = n => Math.round(n).toLocaleString('de-DE');

function hParseNum(s, type) {
  s = String(s).trim().replace(/[^\d,.\-]/g, '');
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (s.includes(',')) s = (type === 'steps' && /^\d{1,3}(,\d{3})+$/.test(s)) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if ((type === 'steps' || type === 'ex') && /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return parseFloat(s);
}
// Datenart aus dem Kennwort oder aus dem Namen, den Kurzbefehle für die Probe liefert (deutsch oder englisch)
function hType(raw) {
  const k = String(raw || '').toUpperCase().replace(/[^A-ZÄÖÜ]/g, '');
  if (H_TYPES[k]) return H_TYPES[k];
  const s = String(raw || '').toLowerCase();
  if (/temperat/.test(s)) return 'wtemp';
  if (/variab|hrv/.test(s)) return 'hrv';
  if (/ruhe.*herz|ruhepuls|resting/.test(s)) return 'rhr';
  if (/schritt|step/.test(s)) return 'steps';
  if (/training|exercise|bewegungsminut/.test(s)) return 'ex';
  if (/menstru|periode|period/.test(s)) return 'period';
  if (/schlaf|sleep/.test(s)) return 'sleep';
  return null;
}
const H_MON = { jan: 1, feb: 2, mär: 3, maer: 3, mrz: 3, mar: 3, apr: 4, mai: 5, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, okt: 10, oct: 10, nov: 11, dez: 12, dec: 12 };
function hParseDate(s) {
  s = String(s || '').trim();
  if (!s) return null;
  // z. B. „24. Okt. 2026 um 07:30“ oder „24. Oktober 2026, 07:30“
  const mm = s.match(/(\d{1,2})\.?\s*([A-Za-zÄÖÜäöü]{3,})\.?\s*(\d{4})(?:[,\s]+(?:um\s)?(\d{1,2}):(\d{2}))?/);
  if (mm) { const mo = H_MON[mm[2].toLowerCase().slice(0, 3)] || H_MON[mm[2].toLowerCase().slice(0, 4)]; if (mo) return new Date(+mm[3], mo - 1, +mm[1], mm[4] ? +mm[4] : 12, mm[5] ? +mm[5] : 0); }
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) { const d = new Date(s.length === 10 ? s + 'T12:00:00' : s); return isNaN(d) ? null : d; }
  const m = s.match(/(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{2,4})(?:[,\s]+(?:um\s)?(\d{1,2}):(\d{2}))?/);
  if (m) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(y, +m[2] - 1, +m[1], m[4] ? +m[4] : 12, m[5] ? +m[5] : 0); }
  const d = new Date(s.replace(/\u202f|\u00a0/g, ' ').replace(/ at | um /, ' ')); return isNaN(d) ? null : d;
}
const nightKey = d => toISO(new Date(d.getTime() + 4 * 3600e3));
function sleepKind(v) {
  const s = String(v).trim().toLowerCase();
  if (/^\d+$/.test(s)) return s === '0' ? 'bed' : s === '2' ? 'awake' : 'sleep';
  if (s.includes('wach') || s.includes('awake')) return 'awake';
  if (s.includes('bett') || s.includes('inbed') || s.includes('in bed')) return 'bed';
  return 'sleep';
}
function flowOf(v) {
  const s = String(v).trim().toLowerCase();
  if (/^\d+$/.test(s)) return { 1: 3, 2: 2, 3: 3, 4: 4, 5: 0 }[s] ?? 0;
  if (s.includes('angabe') || s.includes('unspec') || s.includes('nicht')) return 3;
  if (s.includes('kein') || s.includes('none')) return 0;
  if (s.includes('leicht') || s.includes('light')) return 2;
  if (s.includes('mittel') || s.includes('medium')) return 3;

function unionMinutes(iv) {

function phaseCard(i) {

    const a = inP.filter(e => e.d[k]).map(e => e.d[k]), b = outP.filter(e => e.d[k]).map(e => e.d[k]);
    if (a.length < 5 || b.length < 10) return null;
    const d = mean(a) - mean(b);
    return Math.abs(d) >= .4 ? { d, a: mean(a), b: mean(b) } : null;
  };
  const S = [];
  const m = cmp('mood'), en = DB.settings.modules.energy ? cmp('energy') : null;
  const dir = d => d < 0 ? 'spürbar niedriger' : 'spürbar höher';
  if (m && en && Math.sign(m.d) === Math.sign(en.d)) S.push(`Stimmung und Energie sind in dieser Phase ${dir(m.d)} als im restlichen Zyklus (Stimmung Ø ${num(m.a)} statt ${num(m.b)}, Energie Ø ${num(en.a)} statt ${num(en.b)}).`);
  else {
    if (m) S.push(`Deine Stimmung ist in dieser Phase ${dir(m.d)} als im restlichen Zyklus (Ø ${num(m.a)} statt ${num(m.b)}).`);
    if (en) S.push(`Deine Energie ist in dieser Phase ${dir(en.d)} als im restlichen Zyklus (Ø ${num(en.a)} statt ${num(en.b)}).`);
  }
  if (inP.length >= 5 && outP.length >= 10) {
    const share = (list, s) => list.filter(e => e.d.sym && e.d.sym[s]).length / list.length;
    const ids = [...new Set(inP.flatMap(e => Object.keys(e.d.sym || {})))];
    const typ = ids.map(s => ({ s, a: share(inP, s), b: share(outP, s) })).filter(x => x.a >= .3 && x.a >= 2 * x.b).sort((x, y) => y.a - x.a).slice(0, 2);
    if (typ.length) S.push(`Typisch für dich in dieser Phase: ${typ.map(x => symLabel(x.s).replace('­', '')).join(' und ')}.`);
  }
  if (p === 'lut') {
    const det = c.valid.filter(cy => cy.ovuSrc !== 'calc').map(cy => cy.length - cy.ovuDay);
    const L = det.length >= 2 ? Math.round(mean(det)) : null;
    if (L != null && (L <= 11 || L >= 15)) S.push(`Gemessen dauert deine Lutealphase etwa ${L} Tage, ${L <= 11 ? 'etwas kürzer' : 'etwas länger'} als die üblichen 12 bis 14.`);
  }

  return `<div class="card"><div class="eyebrow">Über diese Phase</div><h3 style="margin:6px 0 8px">${PH[p].n}</h3>
    <p style="margin:0 0 4px">${P.lead}</p>
    ${P.parts.map(([h, t]) => `<div class="field-l" style="margin:16px 0 4px">${h}</div>${t.split('\n\n').map((x, k) => `<p style="margin:${k ? 8 : 0}px 0 0;color:var(--ink2)">${x}</p>`).join('')}`).join('')}
    ${mine}</div>`;
}

<script>
// =========================================================
// Auswertung: erst Erkenntnisse in Worten, Details auf Wunsch
// =========================================================
function phaseCompare(p) {
  const known = analyze('all').all.filter(e => e.i && !e.i.pred);
  const inP = known.filter(e => e.i.phase === p), outP = known.filter(e => e.i.phase !== p);
  const cmp = k => {
    const a = inP.filter(e => e.d[k]).map(e => e.d[k]), b = outP.filter(e => e.d[k]).map(e => e.d[k]);
    if (a.length < 5 || b.length < 10) return null;
    const d = mean(a) - mean(b);
    return Math.abs(d) >= .4 ? { d } : null;
  };
  const share = (list, f) => list.length ? list.filter(f).length / list.length : 0;
  let syms = [], feels = [];
  if (inP.length >= 5 && outP.length >= 10) {
    const ids = [...new Set(inP.flatMap(e => Object.keys(e.d.sym || {})))];
    syms = ids.map(s => ({ s, a: share(inP, e => e.d.sym && e.d.sym[s]), b: share(outP, e => e.d.sym && e.d.sym[s]) }))
      .filter(x => x.a >= .3 && x.a >= 2 * x.b).sort((x, y) => y.a - x.a).slice(0, 2).map(x => x.s);
    const fids = [...new Set(inP.flatMap(e => e.d.feel || []))];
    feels = fids.map(f => ({ f, a: share(inP, e => (e.d.feel || []).includes(f)), b: share(outP, e => (e.d.feel || []).includes(f)) }))
      .filter(x => x.a >= .12 && x.a >= 1.6 * x.b && FEEL[x.f]).sort((x, y) => y.a - x.a).slice(0, 2).map(x => x.f);
  }
  return { n: inP.length, m: cmp('mood'), en: DB.settings.modules.energy ? cmp('energy') : null, syms, feels };
}
function phaseWords(p) {
  const x = phaseCompare(p);
  if (x.n < 5) return 'Dafür gibt es noch zu wenige Einträge.';
  const parts = [];
  if (x.m) parts.push(`${qWord(x.m.d)} ${x.m.d > 0 ? 'bessere' : 'gedrücktere'} Stimmung`);
  if (x.en) parts.push(`${qWord(x.en.d)} ${x.en.d > 0 ? 'mehr' : 'weniger'} Energie`);
  if (!parts.length) parts.push('Stimmung und Energie wie sonst');
  let s = cap(parts.join(', '));
  const fl = x.feels.filter(f => !(f === 'energie' && x.en));
  if (fl.length) s += `, häufiger ${fl.map(f => FEEL[f].l).join(' und ')}`;
  s += '.';
  if (x.syms.length) s += ` Oft ${x.syms.map(id => symLabel(id).replace('­', '')).join(' und ')}.`;

}
// Einträge, die dasselbe meinen, nur einmal zeigen; Medikamente sind Folge, nicht Einfluss
const GROUP = { 'Sport': 'bewegung', '30 Min. Training oder mehr': 'bewegung' };
const NO_FACTOR = ['Schmerzmittel', 'Pille genommen', 'Nahrungsergänzung'];
function factorRows(R) {
  const map = {};
  for (const mk of ['mood', 'energy']) (R.corr[mk] || []).filter(it => it.kind !== 'sym' && !NO_FACTOR.includes(it.label)).forEach(it => {
    const k = it.label + '|' + it.kind;
    (map[k] = map[k] || { label: it.label, kind: it.kind })[mk] = it.diff;
  });
  const rows = Object.values(map).map(r => {
    const main = r.mood != null ? r.mood : r.energy, out = [];
    if (r.mood != null) out.push(`${qWord(r.mood)} ${r.mood > 0 ? 'bessere' : 'schlechtere'} Stimmung`);
    if (r.energy != null && (r.mood == null || Math.sign(r.energy) === Math.sign(r.mood))) out.push(`${r.mood == null ? qWord(r.energy) + ' ' : ''}${r.energy > 0 ? 'mehr' : 'weniger'} Energie`);
    const txt = (r.kind === 'next' ? 'Am Tag danach ' : '') + out.join(', ');
    return { ...r, main, txt: r.kind === 'next' ? txt : cap(txt), str: Math.max(Math.abs(r.mood || 0), Math.abs(r.energy || 0)) };
  }).sort((a, b) => b.str - a.str);
  // Doppelte Aussagen (z. B. Sport und Trainingsminuten mit identischem Effekt) nur einmal zeigen
  const uniq = []; rows.forEach(r => { const grp = GROUP[r.label] || r.label + r.kind; if (!uniq.some(u => (GROUP[u.label] || u.label + u.kind) === grp)) uniq.push(r); });
  const bad = uniq.filter(r => r.main < 0).slice(0, 4);
  const good = uniq.filter(r => r.main > 0 && !bad.some(b => b.label === r.label)).slice(0, 4);
  return { good, bad };
}
const frow = r => `<div class="frow"><div><div class="ft">${esc(r.label)}</div><div class="fs">${r.txt}</div></div>${qDots(r.str)}</div>`;
function miniStrip(L, run, c) {
  const W = 300, x = cd => (cd - 1) / L * W;
  let s = `<svg viewBox="0 0 ${W} 12" class="mini" preserveAspectRatio="none">`;
  for (let cd = 1; cd <= L; cd++) { const ph = mkInfo(cd, L, c.avgPeriod, L - c.lut, false, '', '').phase; s += `<rect x="${x(cd) + .4}" y="4" width="${W / L - .8}" height="4" rx="1" fill="${PH[ph].t}"/>`; }
  if (run) s += `<rect x="${x(run.a)}" y="1.5" width="${(run.b - run.a + 1) / L * W}" height="9" rx="3" fill="#C9741F"/>`;
  return s + '</svg>';
}

function vInsights() {
  const R = analyze('all'), c = C(), M = DB.settings.modules;
  let h = `<div class="topbar" style="margin-bottom:4px"><div><h1 style="margin-bottom:4px">Auswertung</h1></div></div>`;
  const totalMood = R.all.filter(e => e.d.mood).length;
  if (totalMood < 5) {
    return h + `<div class="card empty"><div class="serif">Hier entstehen deine Muster</div><p class="muted">Nach etwa zwei Wochen mit Einträgen zeigen sich erste Zusammenhänge, nach zwei bis drei Zyklen auch Muster im Zyklus.</p>

  }
  h += `<p class="sub" style="margin-top:-8px">Aus ${plural(R.all.length, 'Tag', 'Tagen')} und ${plural(c.valid.length, 'abgeschlossenen Zyklus', 'abgeschlossenen Zyklen')}</p>`;

  // 1. Das Wichtigste
  if (R.sentences.length) h += `<div class="card dark"><div class="eyebrow">Das Wichtigste</div>${R.sentences.slice(0, 3).map(x => `<p class="serif" style="font-size:20px;line-height:1.3;margin:14px 0 0">${x.t}</p>`).join('')}</div>`;

  // 2. Zyklus und Stimmung

    const ms = smooth(mm), es = smooth(ee);

    const se = [{ vals: ms, c: 'var(--olive)', line: true, smooth: true, w: 2.2 }];

    const lvl = v => v == null ? 'kein Eintrag' : v >= 4 ? 'gut' : v >= 3 ? 'mittel' : 'eher schlecht';
    h += `<h2>Dein Zyklus und deine Stimmung</h2><p class="sub">So verläuft ein typischer Zyklus bei dir</p><div class="card">
      <div class="chart">${lineChart({ id: 'typ', n: L, h: 170, yMin: 1, yMax: 5, padL: 44, phases: tph, phaseLabels: true, minimal: true, label: 'Typischer Zyklus',
        yTicks: [{ v: 4.6, l: 'gut', nl: true }, { v: 1.4, l: 'schlecht', nl: true }], series: se,
        tip: j => `<b>Zyklustag ${j + 1}</b>, ${PH[tph[j]].s}<br>Stimmung meist ${lvl(mm[j])}${M.energy ? `<br>Energie meist ${lvl(ee[j]).replace('gut', 'hoch').replace('eher schlecht', 'niedrig')}` : ''}` })}</div>

      <div style="margin-top:14px">${PH_ORDER.map(p => `<div class="prow"><i style="background:${PH[p].c}"></i><div><div class="ft">${PH[p].n}</div><div class="fs">${phaseWords(p)}</div></div></div>`).join('')}</div></div>`;
  }

    if (F.bad.length) h += `<h2>Was dich belastet</h2><p class="sub">An Tagen mit diesen Einträgen geht es dir schlechter</p><div class="card">${F.bad.map(frow).join('')}</div>`;

  }

  // 4. Körper im Zyklus
  const runs = (R.symRuns || []).filter(x => x.share >= .3).slice(0, 6);
  if (runs.length && R.cycN >= 2) {
    // Nach Zeitpunkt gruppieren, damit sich nichts wiederholt
    const groups = [];
    runs.forEach(x => { const key = x.run ? x.when : 'ohne'; let g = groups.find(g => g.key === key); if (!g) { g = { key, syms: [], a: 99, b: 0 }; groups.push(g); } g.syms.push(x); if (x.run) { g.a = Math.min(g.a, x.run.a); g.b = Math.max(g.b, x.run.b); } });
    const nm = x => esc(symLabel(x.sym).replace(/\u00AD/g, '')) + (x.share < .5 ? ' (manchmal)' : '');
    const andJoin = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' und ' + a[a.length - 1] : a[0];

      <div class="clegend" style="margin-top:12px">${PH_ORDER.map(p => `<span><i class="sq" style="background:${PH[p].t}"></i>${PH[p].s}</span>`).join('')}</div></div>`;
  }

  const posF = Object.keys(fc).filter(f => FEEL[f] && FEEL[f].v > 0).sort((a, b) => fc[b] - fc[a]).slice(0, 4);

      yTicks: [{ v: 4.6, l: 'gut', nl: true }, { v: 1.4, l: 'schlecht', nl: true }], xLabels: [{ i: 0, l: dShort(days[0]) }, { i: n - 1, l: 'heute' }],
      series: [{ vals: mr, c: 'var(--olive)', line: true, smooth: true, w: 2.2 }],
      tip: j => { const d = DB.days[days[j]] || {}, i = info(days[j]); return `<b>${dWdShort(days[j])}</b>${i ? `<br>${PH[i.phase].n}` : ''}<br>${d.mood ? MOODS[d.mood] : 'Kein Eintrag'}`; } })}</div>

  // 7. Zyklus

    h += `<p class="serif" style="font-size:20px;line-height:1.3;margin:0">${reg} Meist ${c.minLen === c.maxLen ? c.minLen : `${c.minLen} bis ${c.maxLen}`} Tage, die Periode dauert etwa ${c.avgPeriod} Tage.</p>

function jarSVG(n) {

function runBreath(type) {
  const B = BREATH_TYPES[type], total = BREATH_MIN * 60, t0 = Date.now();
  const head = `<div class="sheet-head"><div class="t"><div class="serif">${B.n}</div><div class="muted" id="bt">${mmss(total)}</div></div><button class="btn sm" data-a="closeSheet">Beenden</button></div>`;
  state.onClose = () => { if ((Date.now() - t0) / 1000 >= 60) exDone('breath'); };
  clearInterval(state.timer);
  const ph = [['Einatmen', state.boxSec, 1], ['Halten', state.boxSec, 1], ['Ausatmen', state.boxSec, .5], ['Halten', state.boxSec, .5]];
  const cyc = ph.reduce((a, x) => a + x[1], 0);
  $('#sheet').innerHTML = head + `<div class="breath"><div class="breath-c" id="bc"></div><div class="serif" id="bl" style="font-size:26px;margin-top:28px">${ph[0][0]}</div><div class="serif" id="bn" style="font-size:20px;color:var(--ink3);margin-top:4px"></div></div>`;
  const bc = $('#bc'), ease = x => .5 - .5 * Math.cos(Math.PI * x);
  state.timer = setInterval(() => {
    if (!$('#bc')) return clearInterval(state.timer);
    const el = (Date.now() - t0) / 1000;
    if (el >= total && el % cyc < .1) return breathFinish(el);
    let p = el % cyc, k = 0;
    while (p >= ph[k][1]) { p -= ph[k][1]; k++; }
    const prev = ph[(k + ph.length - 1) % ph.length][2], cur = ph[k][2];
    bc.style.transform = `scale(${(prev + (cur - prev) * ease(p / ph[k][1])).toFixed(3)})`;
    $('#bl').textContent = ph[k][0];

    $('#bt').textContent = mmss(Math.max(0, total - el));

}

  const A = KR().about, n = ABOUT_Q.filter(([k]) => A[k]).length;
  const show = ABOUT_Q.filter(([k]) => A[k]);
  const pick = show.length ? show[hashStr(todayISO()) % show.length] : null;
  return `<div class="card"><div class="row" style="gap:10px;margin-bottom:6px"><span style="color:var(--olive)">${kic('user')}</span><div class="ft">Über mich</div></div>
    ${pick ? `<p class="fs" style="margin:0">${pick[1]}</p><p class="serif" style="font-size:19px;margin:4px 0 10px">${esc(A[pick[0]])}</p>` : '<p class="fs" style="margin:0 0 10px">Neun Fragen, die du in Ruhe und nach und nach beantworten kannst. Deine Antworten tauchen auch auf, wenn es dir schlecht geht.</p>'}
    <button class="btn sm ${n ? 'ghost' : 'dark'}" data-a="kAbout">${n ? `Antworten ansehen, ${n} von ${ABOUT_Q.length}` : 'Beginnen'}</button></div>`;
}
function openAbout() {
  state.sheet = 'kraft';
  const A = KR().about;
  showSheet(`<div class="sheet-head"><div class="t"><div class="serif">Über mich</div><div class="muted">Wird automatisch gespeichert</div></div><button class="btn sm" data-a="closeSheet">Fertig</button></div>
    ${ABOUT_Q.map(([k, q]) => `<div class="card"><div class="ft" style="margin-bottom:8px">${q}</div><textarea data-ain="${k}" style="min-height:70px" placeholder="Deine Antwort">${esc(A[k] || '')}</textarea></div>`).join('')}`, true);
}

// ---------- CBT-Tagebuch (Gedankenprotokoll nach Greenberger und Padesky)
const CBT_STEPS = 9;
function openCbt(step = 0) {
  state.sheet = 'kraft';
  if (step === 0 && !state.cbt) state.cbt = { situation: '', feel: [], body: '', thought: '', dist: [], pro: '', contra: '', balanced: '' };
  const c = state.cbt;
  const head = `<div class="sheet-head"><div class="t"><div class="serif">CBT-Tagebuch</div><div class="muted">Gedankenprotokoll, Schritt ${Math.min(step + 1, CBT_STEPS)} von ${CBT_STEPS}</div></div><button class="btn sm" data-a="closeSheet">Schließen</button></div>`;
  const nav = (label = 'Weiter', skip) => `<div class="row" style="margin-top:14px">${step ? '<button class="btn sm ghost" data-a="kCbtBack">Zurück</button>' : ''}<button class="btn sm dark" data-a="kCbtNext">${label}</button>${skip ? '<button class="link" data-a="kCbtNext">Überspringen</button>' : ''}</div>`;
  const ta = (k, ph) => `<textarea id="cbtField" data-k="${k}" placeholder="${ph}">${esc(c[k])}</textarea>`;
  const slider = (f, key) => { const x = c.feel.find(z => z.f === f) || {}, val = x[key] ?? x.before ?? 50; if (x[key] == null) x[key] = val; return `<div class="cfeel"><div class="between"><span>${FEEL[f] ? FEEL[f].l : esc(f)}</span><b id="cv_${f}_${key}">${val} %</b></div><input type="range" min="0" max="100" step="10" value="${val}" data-cfeel="${f}" data-key="${key}"></div>`; };
  let b = '';
  if (step === 0) b = `<div class="card"><h3>Was ist passiert?</h3><p class="fs" style="margin:-6px 0 10px">Wo warst du, mit wem, was genau ist geschehen? Nur die Fakten.</p>${ta('situation', 'Zum Beispiel: Im Meeting hat meine Chefin meinen Vorschlag übergangen.')}${nav()}</div>`;
  if (step === 1) b = `<div class="card"><h3>Was hast du gefühlt?</h3><p class="fs" style="margin:-6px 0 10px">Wähle ein bis drei Gefühle.</p><div class="chips">${FEELINGS.filter(f => f[2] < 0).map(f => `<button class="chip ${c.feel.some(x => x.f === f[0]) ? 'on' : ''}" data-a="kCbtFeel" data-v="${f[0]}">${f[1]}</button>`).join('')}</div>${nav()}</div>`;
  if (step === 2) b = `<div class="card"><h3>Wie stark war das Gefühl?</h3>${c.feel.map(x => slider(x.f, 'before')).join('') || '<p class="fs">Du hast kein Gefühl gewählt.</p>'}${nav()}</div>`;
  if (step === 3) b = `<div class="card"><h3>Wo hast du es im Körper gespürt?</h3>${ta('body', 'Zum Beispiel: Enge in der Brust, heißes Gesicht')}${nav('Weiter', true)}</div>`;
  if (step === 4) b = `<div class="card"><h3>Was ging dir durch den Kopf?</h3><p class="fs" style="margin:-6px 0 10px">Der Gedanke, der das Gefühl am stärksten ausgelöst hat.</p>${ta('thought', 'Zum Beispiel: Meine Ideen sind ihr egal, ich bin hier überflüssig.')}${nav()}</div>`;
  if (step === 5) b = `<div class="card"><h3>Erkennst du eine Denkfalle?</h3><div class="chips">${DISTORT.map(([k, l, e]) => `<button class="chip ${c.dist.includes(k) ? 'on' : ''}" data-a="kCbtDist" data-v="${k}" style="flex-direction:column;align-items:flex-start;gap:2px;text-align:left"><span>${l}</span><small style="font-size:11.5px;opacity:.75">${e}</small></button>`).join('')}</div>${nav('Weiter', true)}</div>`;
  if (step === 6) b = `<div class="card"><p class="serif" style="font-size:18px;margin:0 0 12px">„${esc(c.thought)}“</p><h3>Was spricht dafür?</h3><p class="fs" style="margin:-6px 0 10px">Fakten, keine Deutungen.</p>${ta('pro', 'Was ist tatsächlich passiert?')}${nav()}</div>`;
  if (step === 7) b = `<div class="card"><p class="serif" style="font-size:18px;margin:0 0 12px">„${esc(c.thought)}“</p><h3>Was spricht dagegen?</h3><p class="fs" style="margin:-6px 0 10px">Gab es Erfahrungen, die nicht dazu passen? Was würdest du einer Freundin in derselben Lage sagen?</p>${ta('contra', 'Zum Beispiel: Letzte Woche wurde mein Vorschlag übernommen.')}${nav()}</div>`;
  if (step === 8) b = `<div class="card"><h3>Ein ausgewogenerer Gedanke</h3><p class="fs" style="margin:-6px 0 10px">Einer, der beides berücksichtigt, was dafür und was dagegen spricht.</p>${ta('balanced', 'Zum Beispiel: Sie hat heute meinen Vorschlag übergangen, das ärgert mich. Es heißt aber nicht, dass meine Arbeit nichts zählt.')}
    ${c.feel.length ? `<div class="field-l">Wie stark sind die Gefühle jetzt?</div>${c.feel.map(x => slider(x.f, 'after')).join('')}` : ''}${nav('Speichern')}</div>`;
  if (step >= CBT_STEPS) {
    const rec = { id: 'c' + Date.now().toString(36), date: todayISO(), ...c, feel: c.feel.map(x => ({ f: x.f, before: x.before ?? 50, after: x.after ?? x.before ?? 50 })) };
    KR().cbt.push(rec); save(); exDone('cbt'); state.cbt = null;
    const ch = rec.feel.filter(x => x.after < x.before);
    b = `<div class="ground"><div class="serif" style="font-size:24px;margin-top:40px">Gut, dass du dir das angeschaut hast.</div>
      ${ch.length ? `<p class="fs" style="margin:10px auto 0;max-width:300px">${andJoin(ch.map(x => FEEL[x.f] ? FEEL[x.f].l : x.f))}: von ${ch.map(x => `${x.before} auf ${x.after} %`).join(', ')}.</p>` : ''}
      <button class="btn dark" style="max-width:260px;margin:24px auto 0" data-a="closeSheet">Fertig</button></div>`;
  }
  if ($('#sheetWrap').classList.contains('open') && state.sheet === 'kraft' && $('#sheet .sheet-head .serif') && $('#sheet .sheet-head .serif').textContent === 'CBT-Tagebuch') $('#sheet').innerHTML = head + b; else showSheet(head + b, true);
  state.cbtStep = step;
  $('#sheet').scrollTop = 0;
}
function cbtSaveField() { const f = $('#cbtField'); if (f && state.cbt) state.cbt[f.dataset.k] = f.value.trim(); }
function cbtList() {
  const L = KR().cbt.slice().reverse();
  return `<div class="card"><div class="row" style="gap:10px;margin-bottom:6px"><span style="color:var(--olive)">${kic('thought')}</span><div class="ft">Deine CBT-Einträge</div></div>
    ${L.slice(0, 3).map(r => `<button class="kstep" style="padding:8px 0" data-a="kCbtView" data-v="${r.id}"><span>${esc(r.thought || r.situation)}<small>${dShort(r.date)}${r.balanced ? ', mit neuem Gedanken' : ''}</small></span></button>`).join('')}
    ${L.length > 3 ? `<p class="note" style="margin:6px 0 0">Und ${plural(L.length - 3, 'weiteres', 'weitere')}</p>` : ''}</div>`;
}
function openCbtView(id) {
  const r = KR().cbt.find(x => x.id === id); if (!r) return;
  state.sheet = 'kraft';
  const row = (l, v) => v ? `<div class="field-l">${l}</div><p style="margin:0">${esc(v)}</p>` : '';
  showSheet(`<div class="sheet-head"><div class="t"><div class="serif">Gedankenprotokoll</div><div class="muted">${dLong(r.date)}</div></div><button class="btn sm" data-a="closeSheet">Fertig</button></div>
    <div class="card">${row('Situation', r.situation)}
    ${r.feel.length ? `<div class="field-l">Gefühle</div><p style="margin:0">${r.feel.map(x => `${FEEL[x.f] ? FEEL[x.f].l : x.f} ${x.before} % auf ${x.after} %`).join(', ')}</p>` : ''}
    ${row('Im Körper', r.body)}${row('Gedanke', r.thought)}
    ${r.dist.length ? `<div class="field-l">Denkfallen</div><p style="margin:0">${r.dist.map(k => (DISTORT.find(d => d[0] === k) || ['', k])[1]).join(', ')}</p>` : ''}
    ${row('Was dafür spricht', r.pro)}${row('Was dagegen spricht', r.contra)}${row('Ausgewogenerer Gedanke', r.balanced)}
    <button class="link" style="color:var(--men);margin-top:14px" data-a="kCbtDel" data-v="${r.id}">Löschen</button></div>`, true);
}

// ---------- Aktionen
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, t = todayISO();
  const rerender = kRefresh;
  switch (a) {
    case 'kCbt': state.cbt = null; openCbt(0); break;
    case 'kCbtNext': cbtSaveField(); if (state.cbtStep === 1 && !state.cbt.feel.length) { toast('Wähle mindestens ein Gefühl'); return; } if ((state.cbtStep === 0 && !state.cbt.situation) || (state.cbtStep === 4 && !state.cbt.thought)) { toast('Schreib ein paar Worte dazu'); return; } openCbt(state.cbtStep + 1); break;
    case 'kCbtBack': cbtSaveField(); openCbt(state.cbtStep - 1); break;
    case 'kCbtFeel': { const c = state.cbt, i = c.feel.findIndex(x => x.f === v); if (i >= 0) c.feel.splice(i, 1); else if (c.feel.length < 3) c.feel.push({ f: v, before: 50 }); else { toast('Höchstens drei Gefühle'); return; } el.classList.toggle('on', c.feel.some(x => x.f === v)); break; }
    case 'kCbtDist': { const c = state.cbt; c.dist = c.dist.includes(v) ? c.dist.filter(x => x !== v) : c.dist.concat(v); el.classList.toggle('on'); break; }
    case 'kCbtView': openCbtView(v); break;
    case 'kCbtDel': if (confirm('Dieses Protokoll löschen?')) { KR().cbt = KR().cbt.filter(x => x.id !== v); save(); closeSheet(); } break;
    case 'kAbout': openAbout(); break;
    case 'kCareLvl': upd(t, d => d.careLvl = +v); rerender(); break;
    case 'kCare': upd(t, d => { d.care = d.care || []; d.care = d.care.includes(v) ? d.care.filter(x => x !== v) : d.care.concat(v); }); rerender(); break;
    case 'kCareMore': state.careOff = (state.careOff || 0) + 1; rerender(); break;
    case 'kCareOwn': { const l = (prompt('Welche kleine Gewohnheit tut dir gut?') || '').trim(); if (!l) return; KR().habits.push({ id: 'h' + Date.now().toString(36), l, lvl: careLevel(t).l }); save(); rerender(); break; }
    case 'kWalkStart': KR().walkStart = new Date().toISOString(); save(); toast('Viel Freude draußen'); rerender(); break;
    case 'kWalkEnd': openWalkEnd(false); break;
    case 'kWalkAdd': openWalkEnd(true); break;
    case 'kWalkMin': { const w = state.walkDraft; w.min = clamp(w.min + +v, 5, 300); $('#wMin').innerHTML = `${w.min}<small>Minuten</small>`; break; }
    case 'kWalkFeel': state.walkDraft.feel = v; document.querySelectorAll('[data-a=kWalkFeel]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); break;
    case 'kWalkSave': {
      const w = state.walkDraft;
      KR().walks.push({ date: t, min: w.min, feel: w.feel, note: ($('#wNote').value || '').trim() });
      KR().walkStart = null; save();
      upd(t, d => { d.tags = d.tags || []; if (!d.tags.includes('walk')) d.tags = d.tags.concat('walk'); d.ex = d.ex || {}; d.ex.walk = (d.ex.walk || 0) + 1; });
      closeSheet(); toast('Spaziergang gespeichert'); break;
    }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.cfeel && state.cbt) {
    const x = state.cbt.feel.find(z => z.f === el.dataset.cfeel); if (x) x[el.dataset.key] = +el.value;
    const lab = document.getElementById(`cv_${el.dataset.cfeel}_${el.dataset.key}`); if (lab) lab.textContent = el.value + ' %';
  }
  if (el.dataset && el.dataset.ain) { KR().about[el.dataset.ain] = el.value.trim(); clearTimeout(state.aboutT); state.aboutT = setTimeout(save, 400); }
});

<script>

Object.assign(KI, {

});
// gedämpfte Farbtöne je Kachel: Hintergrund und Symbol
const KT = {
  breath: ['#E2E8D3', '#5F7B47'], ground: ['#EEE5D3', '#8C6D3F'], worry: ['#F1DED8', '#9E5446'], cbt: ['#E4E1EA', '#655A7C'],
  care: ['#F4E2CF', '#A8662F'], walk: ['#DCE6DB', '#4E7354'], jar: ['#F3EACD', '#8F7426'], proud: ['#F5E3C9', '#B06F1E'],
  letters: ['#DEE4E8', '#556A7B'], about: ['#EAE3D8', '#76664F']
};
function ktile(key, act, icon, title, status) {
  const [bg, fg] = KT[key];
  return `<button class="ktile2" style="background:${bg}" data-a="${act}" data-v="${key}"><span class="kt-ic" style="color:${fg}">${kic(icon)}</span><b>${title}</b><span class="kt-s">${status}</span></button>`;
}
function kRefresh() {
  if (state.kSheet && $('#sheetWrap').classList.contains('open')) renderKSheet();
  else { const y = scrollY; render(); scrollTo(0, y); }
}
function openKSheet(name) { showSheet('', true); state.sheet = 'kraft'; state.kSheet = name; renderKSheet(); }

function vKraft() {
  const t = todayISO(), d = DB.days[t] || {}, i = info(t), h = new Date().getHours(), K = KR();
  let html = `<div class="topbar" style="margin-bottom:10px"><h1 style="margin:0">Kraft</h1></div>`;
  html += gardenCard(); setTimeout(gStart, 0);

  if (readyLetters().length) html += `<button class="card sugg" style="width:100%;text-align:left;border:0" data-a="kLetterOpen"><div class="sugg-ic">${kic('mail')}</div><div><div class="serif" style="font-size:19px">Ein Brief von dir wartet</div><div class="fs">Geschrieben am ${dShort(readyLetters()[0].written)}</div></div></button>`;
  if (sorgenzeitDue()) html += `<button class="card sugg" style="width:100%;text-align:left;border:0" data-a="kReview"><div class="sugg-ic">${kic('box')}</div><div><div class="serif" style="font-size:19px">Deine Sorgenzeit</div><div class="fs">${plural(boxWorries().length, 'Sorge wartet', 'Sorgen warten')} in der Box</div></div></button>`;

  // Morgen oder Abend, kompakt
  if (h < 16) {
    const sug = i ? INTENT_SUG[i.phase] : INTENT_SUG.fol;
    html += `<div class="card"><div class="eyebrow">Deine Absicht für heute</div>
      ${d.intent ? `<div class="between" style="margin-top:6px"><p class="serif" style="font-size:21px;margin:0">${esc(d.intent)}</p><button class="link" data-a="kIntentClear">Ändern</button></div>`
        : `<div class="chips" style="margin:10px 0">${sug.map(x => `<button class="chip" data-a="kIntent" data-v="${esc(x)}">${x}</button>`).join('')}</div>
           <div class="row"><input class="inp" id="kIntentIn" placeholder="Oder in eigenen Worten"><button class="btn sm dark" data-a="kIntentSave">Setzen</button></div>`}</div>`;
  } else {
    html += `<div class="card"><div class="eyebrow">Dein Abend</div>
      ${d.intent ? `<div class="field-l" style="margin-top:8px">Wie lief es mit „${esc(d.intent)}“?</div><div class="opts" style="--n:3">${[['ja', 'Gut'], ['teils', 'Teils'], ['nein', 'Eher nicht']].map(([v, l]) => `<button class="opt ${d.intentDone === v ? 'on' : ''}" data-a="kIntentDone" data-v="${v}">${l}</button>`).join('')}</div>` : ''}
      <div class="field-l">Was war heute gut?</div><input class="inp" data-in="k_grat" placeholder="Eine Sache reicht" value="${esc(d.grat || '')}">
      <div class="field-l">Worauf bist du heute stolz?</div><input class="inp" data-in="k_proud" placeholder="Auch Kleines zählt" value="${esc(d.proud || '')}"></div>`;
  }

  // Kacheln
  const doList = K.worries.filter(w => w.type === 'do' && w.status === 'open'), inBox = boxWorries().length;

  html += `<h2>Wenn es gerade viel ist</h2><div class="kgrid">
    ${ktile('breath', 'kBreath', 'wind', 'Atmen', '5 Minuten Box-Atmung')}

    ${ktile('worry', 'kSheet', 'box', 'Sorgenbox', doList.length ? plural(doList.length, 'nächster Schritt offen', 'nächste Schritte offen') : inBox ? `${inBox} in der Box` : 'Gedanken ablegen')}
    ${ktile('cbt', K.cbt.length ? 'kSheet' : 'kCbt', 'thought', 'CBT-Tagebuch', K.cbt.length ? plural(K.cbt.length, 'Eintrag', 'Einträge') : 'Gedanken prüfen')}
  </div>
  <h2>Für dich</h2><div class="kgrid">
    ${ktile('care', 'kSheet', 'heart', 'Fürsorge', care.length ? `Heute ${care.length} erledigt` : ['', 'Für wenig Energie', 'Für mittlere Energie', 'Für viel Energie'][cl])}
    ${ktile('jar', 'kSheet', 'jar', 'Dankbarkeitsglas', grats().length ? plural(grats().length, 'Zettel', 'Zettel') : 'Noch leer')}

  </div>`;
  return html;
}

function renderKSheet() {
  const n = state.kSheet, t = todayISO(), d = DB.days[t] || {}, K = KR();
  const titles = { worry: 'Sorgenbox', cbt: 'CBT-Tagebuch', care: 'Fürsorge', walk: 'Spaziergang', jar: 'Dankbarkeitsglas', proud: 'Stolz-Momente', letters: 'Briefe an dich' };

    b += `<div class="card" style="margin-top:14px"><p class="fs" style="margin:0">${inBox ? `${plural(inBox, 'Sorge liegt', 'Sorgen liegen')} in der Box bis zu deiner Sorgenzeit.` : 'Die Box ist gerade leer.'}${released ? ` Losgelassen hast du bisher ${plural(released, 'Sorge', 'Sorgen')}.` : ''}</p>
      <div class="row" style="margin-top:12px"><span class="fs">Deine Sorgenzeit</span><input class="inp" type="time" style="max-width:120px;padding:6px 10px" data-in="k_stime" value="${K.stime}"></div></div>`;

}
function openBackupSheet(mode) { if (!$('#sheetWrap').classList.contains('open')) showSheet('', true); backupSheet(mode); }
function exportData() { openBackupSheet('export'); }
async function doEncrypt(btn) {
  const pw = $('#bkPw').value, pw2 = $('#bkPw2').value;
  if (pw.length < 10) return backupSheet('export', 'Bitte mindestens 10 Zeichen verwenden.');
  if (pw !== pw2) return backupSheet('export', 'Die Passwörter stimmen nicht überein.');
  btn.disabled = true; btn.textContent = 'Wird verschlüsselt';
  try {
    const enc = await encryptBackup(DB, pw);
    state.bkOut = new File([JSON.stringify(enc)], `gezeiten-sicherung-${todayISO()}.json`, { type: 'application/json' });
    backupSheet('ready');
  } catch (e) { backupSheet('export', 'Verschlüsseln hat nicht geklappt. Dieses Gerät unterstützt die nötige Verschlüsselung womöglich nicht.'); }
}
async function doSave() {
  const file = state.bkOut; if (!file) return;
  const done = () => { DB.settings.lastBackup = todayISO(); save(); state.bkOut = null; toast('Sicherung erstellt'); state.sheet = 'settings'; renderSettings(); render(); };
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Gezeiten Sicherung' }); done(); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  done();
}
function applyImport(d) {
  if (!d || typeof d.days !== 'object' || !d.settings) throw new Error('Format');
  if (!confirm(`Sicherung mit ${Object.keys(d.days).length} Tagen importieren? Deine aktuellen Daten werden ersetzt.`)) return false;
  localStorage.setItem(LS_KEY, JSON.stringify(d)); DB = loadDB(); DB.settings.onboarded = true; save();
  toast('Sicherung importiert'); return true;
}
async function doDecrypt(btn) {
  const pw = $('#bkPwI').value; if (!pw) return;
  btn.disabled = true; btn.textContent = 'Wird entschlüsselt';
  let d;
  try { d = await decryptBackup(state.bkFile, pw); }
  catch (e) { return backupSheet('import', 'Das Passwort passt nicht, oder die Datei ist beschädigt.'); }
  try { if (applyImport(d)) { state.bkFile = null; closeSheet(); } else backupSheet('import'); }
  catch (e) { backupSheet('import', 'Die Datei enthält keine gültige Sicherung.'); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'bkEncrypt') doEncrypt(el);
  if (a === 'bkSave') doSave();
  if (a === 'bkDecrypt') doDecrypt(el);
  if (a === 'bkBack') { state.bkOut = null; state.bkFile = null; if (typeof renderSettings === 'function') { state.sheet = 'settings'; renderSettings(); } else closeSheet(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || state.sheet !== 'backup') return;
  const b = document.querySelector(state.bkMode === 'import' ? '[data-a=bkDecrypt]' : '[data-a=bkEncrypt]'); if (b) b.click();
});
$('#healthFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = importHealthText(await f.text());
  if (state.sheet === 'health') renderHealth(r); else { toast(healthResultMsg(r)); render(); }
});
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let d;
  try { d = JSON.parse(await f.text()); } catch (err) { toast('Datei konnte nicht gelesen werden'); return; }
  if (d && d.app === 'gezeiten' && d.data && d.salt) { state.bkFile = d; openBackupSheet('import'); return; }
  // ältere, unverschlüsselte Sicherungen lassen sich weiterhin einlesen
  try { if (applyImport(d)) { if (state.sheet === 'settings') renderSettings(); render(); } } catch (err) { toast('Datei konnte nicht gelesen werden'); }
});

// ---------- Aktionen
const newId = l => 'c_' + l.toLowerCase().replace(/[^a-z0-9äöüß]+/g, '_').slice(0, 20) + '_' + Date.now().toString(36);
function refreshAfterLog() { renderLog(); }
document.addEventListener('click', () => { if (_pend) { clearTimeout(_tx); const f = _pend; _pend = null; f(); } }, true);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, iso = state.log;
  switch (a) {
    case 'tab': if (state.sheet) closeSheet(); state.tab = v; if (v === 'cal') state.calJump = true; scrollTo(0, 0); render(); break;
    case 'log': if (state.sheet === 'day') { state.sheet = null; } openLog(v); break;
    case 'day': openDay(v); break;
    case 'closeSheet': closeSheet(); break;
    case 'settings': openSettings(); break;
    case 'quickMood': upd(todayISO(), d => d.mood = +v); toast('Gespeichert'); render(); break;
    case 'logNav': { const n = addDays(iso, +v); if (n > todayISO()) return; state.log = n; state.pOff = 0; $('#sheet').scrollTop = 0; renderLog(); break; }
    case 'flow': upd(iso, d => { d.flow = d.flow === +v ? 0 : +v; delete d.hf; }); refreshAfterLog(); break;
    case 'health': if (state.sheet) { state.sheet = 'health'; $('#sheet').scrollTop = 0; renderHealth(); $('#sheet').scrollTop = 0; } else openHealth(); break;
    case 'healthClip': healthFromClipboard(); break;
    case 'healthPaste': { const r = importHealthText($('#healthText').value); renderHealth(r); break; }
    case 'healthFile': $('#healthFile').click(); break;
    case 'healthClear': if (confirm('Alle aus Apple Health übernommenen Werte löschen? Deine eigenen Einträge bleiben.')) { DB.health = {}; DB.settings.lastHealth = null; save(); renderHealth(); } break;
    case 'hmetric': state.hmetric = v; { const y = scrollY; render(); scrollTo(0, y); } break;
    case 'mood': upd(iso, d => d.mood = d.mood === +v ? 0 : +v); refreshAfterLog(); break;
    case 'feel': upd(iso, d => { d.feel = d.feel || []; d.feel = d.feel.includes(v) ? d.feel.filter(x => x !== v) : d.feel.concat(v); }); refreshAfterLog(); break;
    case 'scale': upd(iso, d => d[el.dataset.k] = d[el.dataset.k] === +v ? 0 : +v); refreshAfterLog(); break;
    case 'sym': upd(iso, d => { d.sym = d.sym || {}; const c = d.sym[v] || 0; if (c >= 3) delete d.sym[v]; else d.sym[v] = c + 1; }); refreshAfterLog(); break;
    case 'tag': upd(iso, d => { d.tags = d.tags || []; d.tags = d.tags.includes(v) ? d.tags.filter(x => x !== v) : d.tags.concat(v); }); refreshAfterLog(); break;
    case 'water': upd(iso, d => d.water = clamp((d.water || 0) + +v, 0, 20)); refreshAfterLog(); break;
    case 'dis': case 'lib': case 'sex': case 'ovt': { const val = a === 'lib' || a === 'ovt' ? +v : v; upd(iso, d => d[a] = d[a] === val ? 0 : val); refreshAfterLog(); break; }
    case 'viewDay': viewDay(v); break;
    case 'viewEdit': { state.onClose = () => { const day = state.log || v; setTimeout(() => { if (!state.sheet && anyEntry(DB.days[day])) viewDay(day); }, 340); }; openLog(v); break; }
    case 'nextPrompt': state.pOff++; renderLog(); break;
    case 'delDay': if (confirm('Alle Angaben für diesen Tag löschen?')) { delete DB.days[iso]; save(); refreshAfterLog(); toast('Gelöscht'); } break;
    case 'setFlow': upd(v, d => d.flow = +el.dataset.f); closeSheet(); toast(+el.dataset.f ? 'Periode eingetragen' : 'Blutung entfernt'); break;
    case 'calEdit': state.calEdit = !state.calEdit; { const y = scrollY; render(); scrollTo(0, y); } break;
    case 'togglePeriod': { if (v > todayISO()) return; upd(v, d => d.flow = d.flow >= 2 ? 0 : 3); const y = scrollY; render(); scrollTo(0, y); break; }
    case 'jph': state.jph = v; $('#app').innerHTML = vJournal(); break;
    case 'jMonth': { const [yy, mm] = state.jMonth.split('-').map(Number); const nd = new Date(yy, mm - 1 + +v, 1); const nm = `${nd.getFullYear()}-${pad(nd.getMonth() + 1)}`; if (nm > todayISO().slice(0, 7)) return; state.jMonth = nm; $('#app').innerHTML = vJournal(); break; }
    case 'range': state.range = v === 'all' ? 'all' : +v; { const y = scrollY; render(); scrollTo(0, y); } break;
    case 'metric': state.metric = v; { const y = scrollY; render(); scrollTo(0, y); } break;
    case 'step': { const k = el.dataset.k; DB.settings[k] = clamp(DB.settings[k] + +v, +el.dataset.min, +el.dataset.max); save(); renderSettings(); break; }
    case 'mod': DB.settings.modules[v] = !DB.settings.modules[v]; save(); renderSettings(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'loadDemo': loadDemo(); if (state.sheet) closeSheet(); else render(); break;
    case 'clearDemo': if (confirm('Beispieldaten entfernen und mit einem leeren Tagebuch starten?')) { DB.days = {}; DB.health = {}; DB.kraft = DEFAULT().kraft; DB.settings.lastHealth = null; DB.settings.modules.health = false; DB.settings.demo = false; DB.settings.onboarded = false; save(); if (state.sheet) closeSheet(); else render(); } break;
    case 'wipe': if (confirm('Wirklich alle Einträge und Einstellungen löschen? Das lässt sich nicht rückgängig machen.')) { localStorage.removeItem(LS_KEY); DB = DEFAULT(); invalidate(); closeSheet(); } break;
    case 'onbStep': onb[el.dataset.k] = clamp(onb[el.dataset.k] + +v, el.dataset.k === 'cycleLen' ? 20 : 2, el.dataset.k === 'cycleLen' ? 45 : 10); renderOnboarding(); break;
    case 'onbDone': {
      Object.assign(DB.settings, { name: onb.name.trim(), cycleLen: onb.cycleLen, periodLen: onb.periodLen, onboarded: true, demo: false });
      if (onb.last) DB.settings.lastStart = onb.last;
      save(); document.querySelector('.onb').remove(); render(); break;
    }
    case 'onbDemo': DB.settings.name = onb.name.trim(); loadDemo(); render(); break;
  }
});
let _tx, _pend = null;
const later = (fn, ms) => { clearTimeout(_tx); _pend = fn; _tx = setTimeout(() => { _pend = null; fn(); }, ms); };
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  const val = el.value;
  if (k === 'jq') { state.jq = val; $('#jlist').innerHTML = journalList(); return; }
  if (k === 'onbName') { onb.name = val; return; }
  if (k === 'onbLast') { onb.last = val; return; }
  if (k === 'name') { DB.settings.name = val; later(save, 300); return; }
  if (k === 'lastStart') { DB.settings.lastStart = val || null; save(); return; }
  if (k === 'k_stime') { if (val) { DB.kraft.stime = val; save(); } return; }
  if (k.startsWith('k_')) { const f = k.slice(2); later(() => upd(todayISO(), d => d[f] = val.trim() ? val : ''), 400); return; }
  const iso = state.log; if (!iso) return;
  if (k === 'bbt') { const n = parseFloat(val.replace(',', '.')); later(() => upd(iso, d => d.bbt = n >= 34 && n <= 42 ? n : 0), 400); return; }
  const pq = k === 'pAns' && $('#promptQ') ? $('#promptQ').textContent : '';
  later(() => upd(iso, d => {
    d[k] = val.trim() ? val : '';
    if (k === 'pAns') d.prompt = val.trim() ? pq : '';
  }), 350);
});


render();
</script>
